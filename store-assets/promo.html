<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Funda Home Value Estimator promotional artwork</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: #64c1ed; display: grid; place-items: center; }
    .halo { position: absolute; width: 70vmin; height: 70vmin; border-radius: 50%; background: #fff; }
    img { position: relative; width: 62vmin; height: 62vmin; }
    .ground { position: absolute; bottom: 0; height: 12%; width: 100%; background: #6a281c; }
    html.small, html.small body { width: 440px; height: 280px; position: relative; }
    .small .halo { width: 210px; height: 210px; left: 115px; top: 20px; }
    .small img { position: absolute; width: 185px; height: 185px; left: 127px; top: 32px; }
    @media (min-width: 800px) {
      .halo { width: 420px; height: 420px; left: 16%; }
      img { width: 350px; height: 350px; position: absolute; left: calc(16% + 35px); }
      .bars { position: absolute; left: 62%; bottom: 12%; display: flex; align-items: end; gap: 32px; }
      .bars span { width: 60px; background: #6a281c; border-radius: 14px 14px 0 0; }
      .bars span:nth-child(1) { height: 120px; }
      .bars span:nth-child(2) { height: 180px; }
      .bars span:nth-child(3) { height: 245px; }
    }
  </style>
</head>
<body>
  <script>if (new URLSearchParams(location.search).get("size") === "small") document.documentElement.className = "small";</script>
  <div class="halo"></div>
  <img src="../extension/assets/logo.svg" alt="Original house logo">
  <div class="bars" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="ground"></div>
</body>
</html>
